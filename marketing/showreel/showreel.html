<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Mana showreel</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; }
  #stage { width: 1440px; height: 1440px; display: block; background: #0a0a0a; }
  text { font-family: "Geist", "Inter", -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1440 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur" />
    </filter>
    <clipPath id="shapeClip"><rect id="shapeClipRect" x="0" y="0" width="0" height="0" rx="0" /></clipPath>
  </defs>

  <rect x="0" y="0" width="1440" height="1440" fill="#0a0a0a" />

  <g id="camera">
    <!-- the one morphing shape -->
    <rect id="shape" x="0" y="0" width="0" height="0" rx="0" fill="#141414" stroke="#2a2a2a" stroke-width="1.5" />

    <!-- tray dot, sits beside the idle waveform -->
    <circle id="trayDot" cx="0" cy="0" r="5" fill="#f5a623" opacity="0" />

    <!-- content layers, one per bar, clipped to the shape -->
    <g id="content" clip-path="url(#shapeClip)">
      <g id="layerIdle" opacity="0"></g>
      <g id="layerListen" opacity="0"></g>
      <g id="layerTranscribe" opacity="0"></g>
      <g id="layerRespond" opacity="0"></g>
      <g id="layerSpeak" opacity="0"></g>
      <g id="layerPlugins" opacity="0"></g>
      <g id="layerConsent" opacity="0"></g>
      <g id="layerResolve" opacity="0"></g>
    </g>
  </g>
</svg>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Timing: derived from the real onset/beat-grid detection run
  // against marketing/showreel/audio/im-fine-trimmed.wav (see
  // analyze_beats.py's output). One bar = one meaningful state
  // change here ("beat" in the brief's prose = story beat, landing
  // on each bar's downbeat), 8 bars, ~16s total, 120.19 BPM.
  // ---------------------------------------------------------------
  var BAR_DUR = 1.9969; // seconds per bar, from sec_per_bar in the detected grid
  var BARS = 8;
  var LOOP_T = BAR_DUR * BARS; // 15.9752s -- seek(LOOP_T) must equal seek(0)
  function barStart(i) { return i * BAR_DUR; }

  // ---------------------------------------------------------------
  // Spring engine: closed-form step response of a damped harmonic
  // oscillator. A value driven by N target changes is the sum of one
  // step response per change (linear superposition -- the system is
  // linear), so seek(t) never carries state between calls and is
  // safe to evaluate out of order.
  // ---------------------------------------------------------------
  function stepResponse(dt, freq, zeta) {
    if (dt <= 0) return 0;
    freq = freq || 2.6;
    zeta = zeta === undefined ? 0.88 : zeta; // light underdamp -- tiny overshoot, never bouncy
    var w0 = 2 * Math.PI * freq;
    var wd = w0 * Math.sqrt(Math.max(1e-6, 1 - zeta * zeta));
    var env = Math.exp(-zeta * w0 * dt);
    return 1 - env * (Math.cos(wd * dt) + (zeta * w0 / wd) * Math.sin(wd * dt));
  }

  // events: [{t, value}, ...] sorted by t. Value before events[0].t
  // is events[0].value (the resting/base value); each subsequent
  // event adds a spring step of size (value[i]-value[i-1]) starting
  // at t[i].
  function spring(t, events, freq, zeta) {
    if (!events.length) return 0;
    var v = events[0].value;
    for (var i = 1; i < events.length; i++) {
      v += (events[i].value - events[i - 1].value) * stepResponse(t - events[i].t, freq, zeta);
    }
    return v;
  }

  // A layer that's "on" for [onT, offT): rises at onT, falls at offT.
  // onT far in the past (e.g. -10) means "already fully on at t=0".
  function pulse(t, onT, offT, freq, zeta) {
    var v = stepResponse(t - onT, freq, zeta) - stepResponse(t - offT, freq, zeta);
    return Math.max(0, Math.min(1, v));
  }

  // ---------------------------------------------------------------
  // Palette (from the brief: near-black canvas, one amber accent,
  // white/off-white text -- nothing else)
  // ---------------------------------------------------------------
  var AMBER = "#f5a623";
  var OFFWHITE = "#f2f0ec";
  var PANEL = "#141414";
  var PANEL_BORDER = "#2a2a2a";
  // Chat bubbles distinguish speaker by alignment + a subtle amber tint on
  // the user's own bubble (vs. Mana's plain panel fill) rather than by
  // introducing new hues -- keeps to the brief's one-accent-color rule
  // while still reading as two distinct speakers, same as the real app's
  // right/left-aligned bubbles.
  var USER_BUBBLE_FILL = "rgba(245,166,35,0.09)";
  var USER_BUBBLE_BORDER = "rgba(245,166,35,0.38)";

  // ---------------------------------------------------------------
  // Shape geometry per bar (x, y, w, h, rx), center-anchored so
  // resizes read as "morphing in place" rather than drifting.
  // Bar 1's resting geometry doubles as the pre-video-start base AND
  // Bar 8's final target, so the loop closes exactly.
  // ---------------------------------------------------------------
  var CX = 720, CY = 720;
  function rectFor(w, h, rx) { return { w: w, h: h, rx: rx, x: CX - w / 2, y: CY - h / 2 }; }

  var GEOM = {
    idle: rectFor(460, 108, 54),
    listen: rectFor(300, 150, 75),
    transcribe: rectFor(460, 140, 24),
    respond: rectFor(620, 340, 24),
    speak: rectFor(260, 260, 130),
    plugins: rectFor(760, 260, 26),
    consent: rectFor(760, 260, 26), // same container as plugins -- only the inner chip animates
    resolve: rectFor(460, 108, 54), // == idle, so the loop is pixel-identical
  };

  var order = ["idle", "listen", "transcribe", "respond", "speak", "plugins", "consent", "resolve"];
  var shapeEvents = { x: [], y: [], w: [], h: [], rx: [] };
  order.forEach(function (name, i) {
    var g = GEOM[name];
    var t = i === 0 ? -10 : barStart(i); // bar 0's geometry IS the base value
    shapeEvents.x.push({ t: t, value: g.x });
    shapeEvents.y.push({ t: t, value: g.y });
    shapeEvents.w.push({ t: t, value: g.w });
    shapeEvents.h.push({ t: t, value: g.h });
    shapeEvents.rx.push({ t: t, value: g.rx });
  });

  // ---------------------------------------------------------------
  // Camera: a subtle drift/zoom per bar so each beat fills the frame
  // with intent, expressed as a scale + translate on #camera around
  // the shape's own center (so zooming never looks like panning off
  // a fixed point).
  // ---------------------------------------------------------------
  var CAM = [
    { scale: 1.00, dx: 0, dy: 0 },     // idle -- resting
    { scale: 1.05, dx: 0, dy: -10 },   // listen -- lean in
    { scale: 1.03, dx: 0, dy: 0 },     // transcribe
    { scale: 1.07, dx: 0, dy: 10 },    // respond -- settle lower, panel reads bigger
    { scale: 1.10, dx: 0, dy: -6 },    // speak -- closest, most intimate beat
    { scale: 1.02, dx: 0, dy: 0 },     // plugins -- pull back, wide grid needs room
    { scale: 1.04, dx: 0, dy: 4 },     // consent -- nudge toward the growing chip
    { scale: 1.00, dx: 0, dy: 0 },     // resolve -- back to resting, matches idle exactly
  ];
  var camEvents = { scale: [], dx: [], dy: [] };
  order.forEach(function (name, i) {
    var c = CAM[i];
    var t = i === 0 ? -10 : barStart(i);
    camEvents.scale.push({ t: t, value: c.scale });
    camEvents.dx.push({ t: t, value: c.dx });
    camEvents.dy.push({ t: t, value: c.dy });
  });

  // ---------------------------------------------------------------
  // Layer visibility windows. Cross-fade overlap (~0.18s) so one
  // beat's content is finishing its blur-out while the next is
  // starting its blur-in, per the "content swaps with a short blur"
  // direction. Idle is the one layer that's on at both t=0 (base
  // state, no fade-in) and again at the very end (fading in ahead of
  // the loop point so t=0 and t=LOOP_T read identically).
  var XFADE = 0.20;
  // The loop-closing crossfade (resolve -> idle) needs far more settle
  // time than an ordinary mid-video crossfade: seek(LOOP_T) must be
  // pixel-identical to seek(0), where layerIdle is already at a clean
  // 1.0 (no transient) and layerResolve at a clean 0.0. A 0.2s window
  // only gets the spring to ~0.94 -- visibly short of matching frame 0,
  // producing a pop on loop. 0.6s (~11 time constants at this spring's
  // damping) settles to >0.999, well inside floating-point-invisible.
  var LOOP_XFADE = 0.6;
  var LAYER_WINDOWS = {
    layerIdle: [[-10, barStart(1) + XFADE], [LOOP_T - LOOP_XFADE, LOOP_T + 10]],
    layerListen: [[barStart(1) - XFADE, barStart(2) + XFADE]],
    layerTranscribe: [[barStart(2) - XFADE, barStart(3) + XFADE]],
    layerRespond: [[barStart(3) - XFADE, barStart(4) + XFADE]],
    layerSpeak: [[barStart(4) - XFADE, barStart(5) + XFADE]],
    layerPlugins: [[barStart(5) - XFADE, barStart(7) + XFADE]], // plugins stays visible through the consent beat too (same container)
    layerConsent: [[barStart(6) - XFADE, barStart(7) + XFADE]],
    layerResolve: [[barStart(7) - XFADE, LOOP_T - LOOP_XFADE]],
  };

  function layerOpacity(t, name) {
    var windows = LAYER_WINDOWS[name];
    var v = 0;
    for (var i = 0; i < windows.length; i++) {
      v += pulse(t, windows[i][0], windows[i][1], 3.2, 0.92);
    }
    return Math.max(0, Math.min(1, v));
  }

  // ---------------------------------------------------------------
  // Static content builders -- run once at load, seek() only ever
  // touches opacity/transform attributes on these, never innerHTML,
  // so text never needs re-measuring mid-scrub.
  // ---------------------------------------------------------------
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function $(id) { return document.getElementById(id); }

  // --- Bar 1: idle waveform ---
  (function buildIdle() {
    var g = $("layerIdle");
    var bars = 28, w = 3.5, gap = 4.2;
    var totalW = bars * w + (bars - 1) * gap;
    var startX = CX - totalW / 2;
    for (var i = 0; i < bars; i++) {
      var r = el("rect", {
        x: startX + i * (w + gap), y: CY - 2, width: w, height: 4, rx: w / 2,
        fill: OFFWHITE, opacity: 0.55, "data-idx": i,
      });
      r.setAttribute("class", "idlebar");
      g.appendChild(r);
    }
  })();

  // --- Bar 2: listening pill + mic glyph ---
  (function buildListen() {
    var g = $("layerListen");
    var mic = el("g", { transform: "translate(" + CX + "," + (CY - 18) + ")" });
    mic.appendChild(el("rect", { x: -10, y: -22, width: 20, height: 32, rx: 10, fill: "none", stroke: AMBER, "stroke-width": 3 }));
    mic.appendChild(el("path", { d: "M -20 -2 A 20 20 0 0 0 20 -2", fill: "none", stroke: AMBER, "stroke-width": 3, "stroke-linecap": "round" }));
    mic.appendChild(el("line", { x1: 0, y1: 18, x2: 0, y2: 28, stroke: AMBER, "stroke-width": 3, "stroke-linecap": "round" }));
    g.appendChild(mic);
    g.appendChild(el("text", {
      x: CX, y: CY + 46, "text-anchor": "middle", fill: OFFWHITE, "font-size": 22, "font-weight": 500,
    })).textContent = "Listening";
  })();

  // --- Bar 3: transcribing -- a real user chat bubble, not a bare text field ---
  var TRANSCRIBE_TEXT = "“wake up, what's on my screen?”";
  var TX_BUBBLE = { x: CX - 190, y: CY - 32, w: 380, h: 64 };
  (function buildTranscribe() {
    var g = $("layerTranscribe");
    g.appendChild(el("rect", {
      x: TX_BUBBLE.x, y: TX_BUBBLE.y, width: TX_BUBBLE.w, height: TX_BUBBLE.h, rx: 18,
      fill: USER_BUBBLE_FILL, stroke: USER_BUBBLE_BORDER, "stroke-width": 1.5,
    }));
    var t = el("text", { id: "transcribeText", x: TX_BUBBLE.x + 20, y: CY + 8, fill: OFFWHITE, "font-size": 24, "font-weight": 400 });
    g.appendChild(t);
    var cursor = el("rect", { id: "transcribeCursor", x: TX_BUBBLE.x + 20, y: CY - 16, width: 2, height: 28, fill: AMBER });
    g.appendChild(cursor);
  })();

  // --- Bar 4: a real two-bubble chat log -- the finished user message
  // (right-aligned, matching bar 3's own bubble style) stays visible while
  // Mana's reply (left-aligned, plain panel fill) streams in below it, the
  // same layout language windows-native-launcher's own ChatLogPanel uses.
  var REPLY_LINES = ["Looks like a build log.", "Line 42 threw on a null ref —", "want me to open the file?"];
  var RESP_USER_BUBBLE = { x: CX - 40, y: CY - 145, w: 340, h: 60 };
  var RESP_MANA_BUBBLE = { x: CX - 290, y: CY - 55, w: 460, h: 190 };
  (function buildRespond() {
    var g = $("layerRespond");
    // the same completed user message, restated here since this is a
    // separate content layer from layerTranscribe
    g.appendChild(el("rect", {
      x: RESP_USER_BUBBLE.x, y: RESP_USER_BUBBLE.y, width: RESP_USER_BUBBLE.w, height: RESP_USER_BUBBLE.h, rx: 16,
      fill: USER_BUBBLE_FILL, stroke: USER_BUBBLE_BORDER, "stroke-width": 1.5,
    }));
    g.appendChild(el("text", {
      x: RESP_USER_BUBBLE.x + 18, y: RESP_USER_BUBBLE.y + 38, fill: OFFWHITE, "font-size": 20,
    })).textContent = TRANSCRIBE_TEXT;

    // a small amber dot stands in for Mana's own avatar next to her reply,
    // same brand-accent-as-identity idea as the tray dot in bar 1
    g.appendChild(el("circle", { cx: RESP_MANA_BUBBLE.x - 18, cy: RESP_MANA_BUBBLE.y + 22, r: 6, fill: AMBER }));
    g.appendChild(el("rect", {
      id: "manaBubbleRect", x: RESP_MANA_BUBBLE.x, y: RESP_MANA_BUBBLE.y, width: RESP_MANA_BUBBLE.w, height: RESP_MANA_BUBBLE.h,
      rx: 18, fill: PANEL, stroke: PANEL_BORDER, "stroke-width": 1.5,
    }));
    REPLY_LINES.forEach(function (line, i) {
      var t = el("text", {
        id: "replyLine" + i, x: RESP_MANA_BUBBLE.x + 22, y: RESP_MANA_BUBBLE.y + 42 + i * 42,
        fill: OFFWHITE, "font-size": 21, opacity: 0,
      });
      t.textContent = line;
      g.appendChild(t);
    });
  })();

  // --- Bar 5: avatar bust -- head + shoulders silhouette with eyes and a
  // lip-synced mouth, not a plain undifferentiated circle. Still an
  // abstract shape (no specific character design -- the real Live2D model
  // art is all-rights-reserved, same reasoning windows-native-launcher's
  // own SessionListForm.cs avatar card uses for its own abstract gradient
  // instead of baking real model art into committed/public source), but
  // one that actually reads as "a face," matching the intended Live2D
  // end-state's continuous parametric motion (idle sway, blink, mouth flap)
  // rather than a static sprite swap.
  (function buildSpeak() {
    var g = $("layerSpeak");
    g.appendChild(el("ellipse", { cx: CX, cy: CY + 74, rx: 92, ry: 54, fill: "#1c1c1c" })); // shoulders
    g.appendChild(el("circle", { id: "avatarHead", cx: CX, cy: CY - 22, r: 50, fill: "#1c1c1c" })); // head
    g.appendChild(el("circle", { id: "eyeL", cx: CX - 17, cy: CY - 28, r: 3.5, fill: OFFWHITE, opacity: 0.7 }));
    g.appendChild(el("circle", { id: "eyeR", cx: CX + 17, cy: CY - 28, r: 3.5, fill: OFFWHITE, opacity: 0.7 }));
    g.appendChild(el("rect", { id: "mouth", x: CX - 12, y: CY - 8, width: 24, height: 4, rx: 2, fill: AMBER }));
    for (var i = 0; i < 3; i++) {
      g.appendChild(el("circle", {
        id: "speakRing" + i, cx: CX, cy: CY, r: 76, fill: "none", stroke: AMBER, "stroke-width": 2, opacity: 0,
      }));
    }
  })();

  // --- Bar 6/7: plugin chip grid + consent chip -- real Mana feature
  // names (see plugins/README.md), not placeholder labels, since a
  // generic glyph grid doesn't actually showcase what Mana's plugin
  // system does. The 4th chip (Discord Bridge) is the one that grows
  // a consent gate in bar 7 -- it posts to an external account on your
  // behalf, unlike the first three, which are self-contained/local.
  var CHIP_GLYPHS = ["tag", "puzzle", "chart", "bridge"];
  var CHIP_LABELS = ["FFXIV Market", "Job Search", "Stock Market", "Discord Bridge"];
  var chipCenters = [];
  (function buildPlugins() {
    var g = $("layerPlugins");
    var cols = 4, chipW = 160, chipH = 160, gap = 20;
    var totalW = cols * chipW + (cols - 1) * gap;
    var startX = CX - totalW / 2 + chipW / 2;
    for (var i = 0; i < cols; i++) {
      var cx = startX + i * (chipW + gap), cy = CY;
      chipCenters.push({ x: cx, y: cy });
      var chip = el("g", { id: "chip" + i, transform: "translate(" + cx + "," + cy + ")" });
      chip.appendChild(el("rect", {
        x: -chipW / 2, y: -chipH / 2, width: chipW, height: chipH, rx: 22,
        fill: PANEL, stroke: PANEL_BORDER, "stroke-width": 1.5,
      }));
      chip.appendChild(glyph(CHIP_GLYPHS[i], 0, -18, OFFWHITE));
      var label = el("text", {
        x: 0, y: 44, "text-anchor": "middle", fill: OFFWHITE, "font-size": 15, "font-weight": 500,
      });
      label.textContent = CHIP_LABELS[i];
      chip.appendChild(label);
      g.appendChild(chip);
    }
  })();

  function glyph(name, cx, cy, color) {
    var g = el("g", { transform: "translate(" + cx + "," + cy + ")" });
    var s = { fill: "none", stroke: color, "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round" };
    if (name === "tag") {
      g.appendChild(el("path", Object.assign({ d: "M -20 -4 L -4 -20 L 20 -20 L 20 4 L -4 20 Z" }, s)));
      g.appendChild(el("circle", { cx: 10, cy: -10, r: 3, fill: color }));
    } else if (name === "puzzle") {
      g.appendChild(el("path", Object.assign({ d: "M -18 -18 h14 a5 5 0 0 1 0 10 v8 h-14 v-8 a5 5 0 0 0 0 -10 z" }, s)));
      g.appendChild(el("rect", Object.assign({ x: -18, y: -18, width: 36, height: 36, rx: 6 }, s)));
    } else if (name === "chart") {
      g.appendChild(el("line", Object.assign({ x1: -18, y1: 18, x2: -18, y2: -6 }, s)));
      g.appendChild(el("line", Object.assign({ x1: -2, y1: 18, x2: -2, y2: -16 }, s)));
      g.appendChild(el("line", Object.assign({ x1: 14, y1: 18, x2: 14, y2: 2 }, s)));
      g.appendChild(el("line", Object.assign({ x1: -22, y1: 18, x2: 22, y2: 18 }, s)));
    } else if (name === "bridge") {
      g.appendChild(el("path", Object.assign({ d: "M -18 -14 h36 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-24 l-8 8 v-8 h-4 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 z" }, s)));
    } else {
      g.appendChild(el("circle", Object.assign({ cx: 0, cy: 0, r: 18 }, s)));
      g.appendChild(el("line", Object.assign({ x1: -8, y1: 0, x2: 8, y2: 0 }, s)));
      g.appendChild(el("line", Object.assign({ x1: 0, y1: -8, x2: 0, y2: 8 }, s)));
    }
    return g;
  }

  (function buildConsent() {
    var g = $("layerConsent");
    // the consent beat grows chip index 3 (Discord Bridge, the one
    // Add-On among these Plugins) and fills in a checkmark toggle
    var ring = el("circle", { id: "consentRing", cx: chipCenters[3].x, cy: chipCenters[3].y - 46, r: 0, fill: "none", stroke: AMBER, "stroke-width": 3 });
    g.appendChild(ring);
    var check = el("path", {
      id: "consentCheck", d: "M " + (chipCenters[3].x - 8) + " " + (chipCenters[3].y - 46) + " l 6 6 l 12 -12",
      fill: "none", stroke: AMBER, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round",
      "stroke-dasharray": "26", "stroke-dashoffset": "26",
    });
    g.appendChild(check);
  })();

  // --- Bar 8: resolve pill ---
  (function buildResolve() {
    var g = $("layerResolve");
    var house = el("path", {
      d: "M " + (CX - 60) + " " + CY + " l 14 -14 l 14 14 M " + (CX - 46) + " " + (CY - 14) + " v -6",
      fill: "none", stroke: AMBER, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round",
    });
    // simpler, cleaner house glyph: base + roof
    g.innerHTML = "";
    var hx = CX - 60, hy = CY;
    g.appendChild(el("path", {
      d: "M " + (hx - 12) + " " + hy + " L " + hx + " " + (hy - 12) + " L " + (hx + 12) + " " + hy + " L " + (hx + 12) + " " + (hy + 10) + " L " + (hx - 12) + " " + (hy + 10) + " Z",
      fill: "none", stroke: AMBER, "stroke-width": 2.5, "stroke-linejoin": "round",
    }));
    g.appendChild(el("text", {
      x: CX + 8, y: CY + 8, "text-anchor": "middle", fill: OFFWHITE, "font-size": 26, "font-weight": 500,
    })).textContent = "Local-First";
  })();

  var idleBars = Array.prototype.slice.call(document.querySelectorAll(".idlebar"));

  // ---------------------------------------------------------------
  // seek(t): the ONE function every frame is computed from. Pure --
  // no reads of prior state, safe to call with any t in any order.
  // ---------------------------------------------------------------
  window.seek = function (t) {
    // shape geometry
    var gx = spring(t, shapeEvents.x);
    var gy = spring(t, shapeEvents.y);
    var gw = Math.max(1, spring(t, shapeEvents.w));
    var gh = Math.max(1, spring(t, shapeEvents.h));
    var grx = Math.max(0, spring(t, shapeEvents.rx));
    var shape = $("shape");
    shape.setAttribute("x", gx); shape.setAttribute("y", gy);
    shape.setAttribute("width", gw); shape.setAttribute("height", gh);
    shape.setAttribute("rx", grx);
    var clipRect = $("shapeClipRect");
    clipRect.setAttribute("x", gx); clipRect.setAttribute("y", gy);
    clipRect.setAttribute("width", gw); clipRect.setAttribute("height", gh);
    clipRect.setAttribute("rx", grx);

    // camera
    var s = spring(t, camEvents.scale);
    var dx = spring(t, camEvents.dx);
    var dy = spring(t, camEvents.dy);
    $("camera").setAttribute(
      "transform",
      "translate(" + CX + "," + CY + ") scale(" + s + ") translate(" + (-CX + dx) + "," + (-CY + dy) + ")"
    );

    // tray dot -- sits just left of the idle pill, on for the same windows as layerIdle
    var trayOp = layerOpacity(t, "layerIdle");
    var td = $("trayDot");
    td.setAttribute("cx", GEOM.idle.x - 30);
    td.setAttribute("cy", CY);
    td.setAttribute("opacity", trayOp * 0.9);

    // layer opacities
    Object.keys(LAYER_WINDOWS).forEach(function (name) {
      $(name).setAttribute("opacity", layerOpacity(t, name));
    });

    // --- per-layer internal motion ---

    // idle waveform: gentle per-bar sine wiggle, amplitude tiny (barely moving)
    idleBars.forEach(function (bar, i) {
      var phase = t * 1.4 + i * 0.35;
      var amp = 3 + 2 * Math.sin(t * 0.6 + i * 0.15);
      var h = 4 + Math.abs(Math.sin(phase)) * amp;
      bar.setAttribute("height", h);
      bar.setAttribute("y", CY - h / 2);
    });

    // transcribe: character-by-character reveal across the bar's window, cursor blink
    var tt0 = barStart(2), tt1 = barStart(3);
    var typeProgress = Math.max(0, Math.min(1, (t - tt0) / (tt1 - tt0 - 0.3)));
    var chars = Math.floor(typeProgress * TRANSCRIBE_TEXT.length);
    var shown = TRANSCRIBE_TEXT.slice(0, chars);
    var textEl = $("transcribeText");
    if (textEl.textContent !== shown) textEl.textContent = shown;
    var w = textEl.getComputedTextLength ? textEl.getComputedTextLength() : shown.length * 13;
    $("transcribeCursor").setAttribute("x", TX_BUBBLE.x + 20 + w + 4);
    $("transcribeCursor").setAttribute("opacity", Math.sin(t * 10) > 0 ? 1 : 0);

    // respond: reply lines stream in, staggered
    REPLY_LINES.forEach(function (_, i) {
      var onT = barStart(3) + 0.15 + i * 0.28;
      $("replyLine" + i).setAttribute("opacity", pulse(t, onT, barStart(4) + BAR_DUR - XFADE, 3.4, 0.9));
      var rise = 10 * (1 - stepResponse(t - onT, 3.4, 0.78));
      $("replyLine" + i).setAttribute("transform", "translate(0," + Math.max(0, rise) + ")");
    });

    // speak: mouth flaps open/closed in time with a synthetic syllable
    // rate (real lip-sync would drive this off playback samples, per
    // VoiceLoop's own lip-sync -- this is the showreel's stand-in), one
    // blink partway through the beat, waveform rings pulse outward
    var speakActive = t > barStart(4) - 0.1 && t < barStart(5) + XFADE;
    var mouthOpen = speakActive ? Math.max(0, Math.sin(t * 11)) : 0;
    var mouthH = 4 + mouthOpen * 14;
    $("mouth").setAttribute("height", mouthH);
    $("mouth").setAttribute("y", CY - 8 - mouthH / 2 + 2);
    var blinkT = barStart(4) + 1.1;
    var blinkPhase = Math.abs(t - blinkT) < 0.09 ? 1 - Math.abs(t - blinkT) / 0.09 : 0;
    var eyeScale = 1 - blinkPhase * 0.85;
    $("eyeL").setAttribute("r", 3.5 * eyeScale);
    $("eyeR").setAttribute("r", 3.5 * eyeScale);
    for (var ring = 0; ring < 3; ring++) {
      var ringPeriod = 0.55, ringOffset = ring * (ringPeriod / 3);
      var ringT = ((t - barStart(4) - ringOffset) % ringPeriod + ringPeriod) % ringPeriod;
      var ringActive = t > barStart(4) && t < barStart(5) + XFADE;
      var rr = 76 + ringT * 90;
      var rOpacity = ringActive ? Math.max(0, 0.5 - ringT / ringPeriod * 0.5) : 0;
      var re = $("speakRing" + ring);
      re.setAttribute("r", rr);
      re.setAttribute("opacity", rOpacity);
    }

    // plugins: chips slide in one by one
    var chip3CenterY = chipCenters[3].y; // consent's grow-scale below composes with this, not a bare reset
    for (var ci = 0; ci < 4; ci++) {
      var chipOnT = barStart(5) + 0.15 + ci * 0.22;
      var chipOp = stepResponse(t - chipOnT, 3.0, 0.82);
      var chipRise = 26 * (1 - chipOp);
      var chipEl = document.getElementById("chip" + ci);
      chipEl.setAttribute("opacity", Math.max(0, Math.min(1, chipOp)));
      var chipCy = chipCenters[ci].y + chipRise;
      if (ci === 3) chip3CenterY = chipCy;
      chipEl.setAttribute("transform", "translate(" + chipCenters[ci].x + "," + chipCy + ")");
    }

    // consent: chip 3 grows a ring + checkmark fills in
    var consentOnT = barStart(6) + 0.1;
    var ringR = 16 * stepResponse(t - consentOnT, 2.8, 0.85);
    $("consentRing").setAttribute("r", ringR);
    var checkFill = stepResponse(t - consentOnT - 0.2, 3.5, 0.9);
    $("consentCheck").setAttribute("stroke-dashoffset", 26 * (1 - checkFill));
    // slight scale-up of the whole chip 3 while the consent gate is active --
    // composed around its OWN current center (chip3CenterY, which already
    // carries the plugins loop's slide-in rise), never a bare translate(cx,cy)
    // reset, which previously clipped chip 3 out of view for the rest of the
    // plugins bar (its rect uses local coordinates around its own center, so
    // resetting the transform to identity-at-origin moved it off-canvas).
    var chip3Grow = 1 + 0.06 * pulse(t, barStart(6) - XFADE, barStart(7) + XFADE, 2.5, 0.88);
    var c3x = chipCenters[3].x, c3y = chip3CenterY;
    // chip3's own <rect> is drawn at its LOCAL origin (x=-75,y=-75 --
    // centered on local (0,0), same as every other chip), so scaling
    // "around its own center" is just scale() in local space, THEN
    // translate out to (c3x,c3y) -- not the translate/scale/translate-
    // back idiom (that idiom is for geometry already drawn at the
    // pivot point; here it silently canceled to a no-op translate
    // whenever chip3Grow was exactly 1, which is what clipped chip 3
    // out of view for the entire plugins bar above).
    document.getElementById("chip3").setAttribute(
      "transform",
      "translate(" + c3x + "," + c3y + ") scale(" + chip3Grow + ")"
    );

    // the consent ring/check glyphs are drawn at absolute page coordinates
    // (not chip-local), anchored 46px above chip 3's own slide-in position
    $("consentRing").setAttribute("cy", c3y - 46);
    var checkY = c3y - 46;
    $("consentCheck").setAttribute("d", "M " + (c3x - 8) + " " + checkY + " l 6 6 l 12 -12");
  };

  window.LOOP_T = LOOP_T;
  window.BAR_DUR = BAR_DUR;

  // default render for viewing this file directly in a browser
  seek(0);
})();
</script>
</body>
</html>
