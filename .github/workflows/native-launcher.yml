name: Native Launcher (Windows)

# Nothing else in this repo's CI builds or tests windows-native-launcher's
# C# project -- previously the only way a regression there got caught was
# a contributor remembering to run `dotnet test` locally. windows-latest
# is required (not ubuntu-latest, unlike every other job in this repo):
# the project targets net10.0-windows and references WinForms + NAudio's
# WASAPI-backed APIs, which only build on Windows, even though the test
# suite itself doesn't touch real audio hardware.

on:
  push:
    branches: [ main ]
    paths:
      - 'windows-native-launcher/**'
      - '.github/workflows/native-launcher.yml'
  pull_request:
    paths:
      - 'windows-native-launcher/**'
      - '.github/workflows/native-launcher.yml'

permissions:
  contents: read

# #1206: a new push to a PR cancels the run for the old commit. Pushes (main
# included) get a group of their own, so they never cancel or replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test windows-native-launcher
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # #1206: restored before Pack Folio so Folio's own restore hits it too.
      # The Folio pin lives in the csproj, so a new pin is a new key.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows-native-launcher/**/*.csproj', 'windows-native-launcher/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # #937: Folio comes from a local package folder (nuget.config). Build
      # it from the commit the launcher pins; both repos are public.
      - name: Pack Folio
        shell: pwsh
        run: ./windows-native-launcher/pack-folio.ps1

      - name: Build
        working-directory: ./windows-native-launcher
        shell: pwsh
        run: dotnet build --configuration Release

      # #1151: the process manager tests start real node processes, and a
      # fresh runner's first node launch is cold (seconds, more with the
      # suite running in parallel). Pay that here: the binary into the file
      # cache, then one run.
      - name: Warm up node
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          $null = [System.IO.File]::ReadAllBytes($node)
          node -e "console.log(process.execPath, process.version)"

      # Also builds ManaNativeLauncher.csproj again via the Tests project's
      # own ProjectReference -- kept as a separate step from the build
      # above anyway, so a plain build failure and a test failure show up
      # as distinct, easy-to-spot steps in the Actions log.
      - name: Test
        working-directory: ./windows-native-launcher/ManaNativeLauncher.Tests
        shell: pwsh
        run: dotnet test --configuration Release
