name: .NET Build & Test

on:
  push:
    branches: [ issue-500-refactor, main ]
  pull_request:
    branches: [ main ]

# The build runs Folio's pack script from its pinned commit (#937); the job
# only needs to read.
permissions:
  contents: read

# #1206: a new push to a PR cancels the run for the old commit. Pushes (main
# included) get a group of their own, so they never cancel or replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # #1206: restored before Pack Folio so Folio's own restore hits it too.
      # The Folio pin lives in the csproj, so a new pin is a new key.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows-native-launcher/**/*.csproj', 'windows-native-launcher/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # #937: Folio comes from a local package folder (nuget.config). Build
      # it from the commit the launcher pins; both repos are public.
      - name: Pack Folio
        shell: pwsh
        run: ./windows-native-launcher/pack-folio.ps1

      - name: Restore dependencies
        run: dotnet restore windows-native-launcher/ManaNativeLauncher.csproj

      - name: Build project
        run: dotnet build windows-native-launcher/ManaNativeLauncher.csproj --configuration Release /v:minimal
