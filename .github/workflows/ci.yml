name: .NET Build & Test

on:
  push:
    branches: [ issue-500-refactor, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows-native-launcher/ManaNativeLauncher.csproj

      - name: Build project
        run: dotnet build windows-native-launcher/ManaNativeLauncher.csproj --configuration Release /v:minimal

      - name: Run tests (if exist)
        run: dotnet test windows-native-launcher/ManaNativeLauncher.Tests.csproj --no-build --verbosity quiet || echo "No tests found or tests skipped"
