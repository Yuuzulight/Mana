<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mana Avatar</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      #live2d,
      #vrm {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom left;
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.32));
        transition:
          transform 120ms ease,
          filter 120ms ease;
        transform-origin: bottom center;
      }

      /* One canvas is picked at load time (VRM preferred, Live2D fallback,
         see renderer.js) -- the id selectors above set display:block
         unconditionally, so [hidden] needs its own rule to actually win. */
      #live2d[hidden],
      #vrm[hidden] {
        display: none;
      }

      body[data-state="talking"] #live2d {
        transform: translateY(-3px) scale(1.015);
        filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.38));
      }

      body[data-state="excited"] #live2d {
        animation: excited-hop 420ms ease-in-out infinite;
      }

      body[data-state="angry"] #live2d {
        animation: angry-hop 300ms ease-in-out infinite;
      }

      @keyframes excited-hop {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg) scale(1.01);
        }
        45% {
          transform: translateY(-10px) rotate(1deg) scale(1.035);
        }
      }

      @keyframes angry-hop {
        0%,
        100% {
          transform: translateY(0) translateX(-1px) rotate(-1deg) scale(1.02);
        }
        50% {
          transform: translateY(-7px) translateX(1px) rotate(1deg) scale(1.035);
        }
      }

      /* Issue #398: the main window's own .mana-captions (issue #362) is
         invisible whenever it's hidden -- the default state, since
         HIDE_MAIN_WINDOW_AFTER_STARTUP defaults to true and this overlay is
         what's actually on screen instead. syncOverlayVisibility keeps this
         window and the main window mutually exclusive, so showing captions
         here too is never a duplicate -- exactly one of the two is ever
         visible at a time. */
      .mana-captions {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: 90%;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(28, 26, 24, 0.85);
        color: #e8e4de;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body data-state="idle">
    <!-- VRM is preferred when a model is configured (issue #161), Live2D
         is the fallback -- renderer.js picks one at load time and
         unhides it; three.js/@pixiv/three-vrm are required() directly in
         vrm-avatar.js (no separate <script> tag needed, unlike Live2D's
         UMD globals below). -->
    <canvas id="vrm" hidden aria-hidden="true"></canvas>
    <canvas id="live2d" aria-hidden="true"></canvas>
    <!-- Issue #398/#362: same on-screen-equivalent-of-spoken-output caption
         feed as the main window, just visible while the overlay (not the
         main window) is what's actually shown. -->
    <div id="mana-captions" class="mana-captions" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <!-- Live2D Cubism Core is proprietary and fetched at setup time
         (npm run fetch-live2d-core); Live2D/VRM are the only renderers --
         no sprite/image fallback. -->
    <script src="../assets/live2d/live2dcubismcore.min.js"></script>
    <script src="../node_modules/pixi.js/dist/browser/pixi.min.js"></script>
    <script src="../node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
    <script src="../renderer/caption-client.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
