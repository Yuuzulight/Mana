<rect x="672" y="689" width="122" height="22" rx="6" fill="#eee7f8" fill-opacity="0.7" stroke="#6a5fb8" stroke-opacity="0.22" stroke-width="1"/>
<text x="680" y="704" font-size="12" font-weight="400" fill="#1b1e3f" text-anchor="start">telegram-bridge</text>
<rect x="842" y="689" width="94" height="22" rx="6" fill="#eee7f8" fill-opacity="0.7" stroke="#6a5fb8" stroke-opacity="0.22" stroke-width="1"/>
<text x="850" y="704" font-size="12" font-weight="400" fill="#1b1e3f" text-anchor="start">discord-bot</text>
