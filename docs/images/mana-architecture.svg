<text x="1000" y="704" font-size="12" font-weight="400" fill="#1b1e3f" text-anchor="start">context-push</text>
<text x="82" y="752" font-size="12" font-weight="400" fill="#67628a" text-anchor="start">Each plugin registers its own routes, injects context into replies, and reports health on its own.</text>
<text x="82" y="770" font-size="12" font-weight="400" fill="#67628a" text-anchor="start">Nothing here is needed for the core voice loop to work.</text>
<rect x="60" y="812" width="1080" height="58" rx="10" fill="#ffffff" fill-opacity="0.55" stroke="#a86b0c" stroke-width="1" stroke-dasharray="6,4"/>
<path d="M70 812.5 H1130" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1"/>
<text x="82" y="836" font-size="14" font-weight="600" fill="#a86b0c" text-anchor="start">Remote AI: explicit opt-in only</text>
<text x="82" y="854" font-size="12" font-weight="400" fill="#67628a" text-anchor="start">OPENAI_API_KEY and ANTHROPIC_API_KEY are ignored unless MANA_ALLOW_REMOTE_AI=1. Nothing leaves the machine by default.</text>
</svg>
